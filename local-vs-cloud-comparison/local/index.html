<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <header>
            <h1>Password Strength Checker</h1>
        </header>
        <div class="input-group">
            <label for="password">Enter Password:</label>
            <input type="password" id="password" placeholder="Type your password here...">
        </div>

        <div class="strength-container">
            <div class="progress-bar-wrapper">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="strength-text" class="strength-text">Strength: Not entered</p>
        </div>

        <div id="hints" class="validation-hints">
            <!-- Validation hints will be populated here by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
