<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <header>
            <h1>Password Strength Checker & Generator</h1>
        </header>

        <div class="controls">
            <!-- Password Length Slider -->
            <div class="control-group">
                <label for="length-slider">Length: <span id="length-value">12</span></label>
                <input type="range" id="length-slider" min="6" max="32" value="12">
            </div>

            <!-- Character Type Controls -->
            <div class="checkbox-group">
                <label>Include:</label>
                <input type="checkbox" id="upper-check" checked> <label for="upper-check">Uppercase</label>
                <input type="checkbox" id="lower-check" checked> <label for="lower-check">Lowercase</label>
                <input type="checkbox" id="number-check" checked> <label for="number-check">Numbers</label>
                <input type="checkbox" id="symbol-check" checked> <label for="symbol-check">Symbols</label>
            </div>

            <!-- Custom Character Types Section -->
            <div class="control-group custom-chars">
                <label>Custom Characters:</label>
                <div class="custom-char-entry">
                    <input type="text" class="custom-char-name" placeholder="Type Name (e.g., Emojis)">
                    <input type="text" class="custom-char-set" placeholder="Character Set (e.g., 😂✨🔥)">
                    <button class="add-custom-btn">Add</button>
                </div>
                <div class="custom-list">
                    <!-- Custom types will be listed here -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="generate-btn" class="action-btn">Generate Password</button>
                <button id="copy-btn" class="action-btn disabled" disabled>Copy</button>
            </div>
        </div>

        <div class="input-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Generated or typed password...">
        </div>

        <div class="strength-container">
            <div class="progress-bar-wrapper">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="strength-text" class="strength-text">Strength: Not entered</p>
        </div >

        <div id="hints" class="validation-hints">
            <!-- Validation hints will be populated here by JavaScript -->
        </div>

        <div id="toast-notification" class="toast"></div>
    </div>

    <script src="script.js"></script>
</body >
</html>
